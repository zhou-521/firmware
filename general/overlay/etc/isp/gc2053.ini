; ============================================================
; GC2053 ISP 参数配置 (SSC377D / infinity6c)
; 安装位置：/etc/isp/gc2053.ini（由 buildroot overlay 自动打包）
; 场景：小车室内外移动场景，1080P@30fps
; 目标：压低夜视噪点、平衡室内外亮度、保留运动细节
; 注意：本文件为 ISP 调参参考；实际生效还需原厂 IQ 文件
;       (/etc/sensors/gc2053.bin) + majestic.yaml 的 isp.sensorConfig 指向它
; ============================================================

[Sensor]
model       = gc2053          ; 固定 GC2053，不换型号
fps         = 30              ; 帧率 30fps（MCLK=24MHz 锁死，不可改）
resolution  = 1920x1080
mclk_hz     = 24000000        ; 与 DTS / 驱动 MCLK 24MHz 一致
bitdepth    = 10              ; Bayer 10bit

[AE]                         ; 自动曝光：压低增益上限抑制夜视噪点
target_y    = 0x40           ; 目标亮度（室内外折中）
max_gain    = 8x             ; 增益上限偏低，避免暗场放大噪声
max_shutter = 33333          ; 1/30s 上限，防运动拖影
anti_flicker= 50             ; 国内 50Hz 工频

[2DNR]                       ; 空域降噪（运动场景保细节）
strength    = 12
[3DNR]                       ; 时域降噪（夜视主力）
strength    = 18             ; 偏强，压低帧间噪声
temporal    = 1

[DayNight]
mode        = auto           ; 室内外自动切换
threshold   = 0x30           ; 切夜视亮度门限
; 注意：IRCUT / 补光由主板 GPIO 控制，ISP 仅做图像处理

[Output]
format      = NV12
